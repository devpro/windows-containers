# title: Continuous Delivery pipeline
# secrets: [ DOCKERHUB_USERNAME, DOCKERHUB_TOKEN ]
name: CD

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      apps: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Identify changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            winsamplenet48svc: samples/dotnet-4.8/SampleWindowsService/*

  image-push:
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    strategy:
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: samples\dotnet-4.8
          file: SampleWindowsService\Dockerfile
          push: true
          tags: devprofr/winsamplenet48svc:1.0.${GITHUB_RUN_ID}

      # - name: Build and push container image
      #   if: matrix.app == 'winsamplenet48svc'
