name: PKG

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dotnet-framework-changes:
    name: Changes .NET Framework
    uses: devpro/github-workflow-parts/.github/workflows/reusable-git-check.yml@93d3944b0f3b224b98c3f3eb34fcf6feb894d98e
    with:
      paths: samples/dotnet-4.8 .github/workflows/pkg.yml
      workflow-parts-version: 93d3944b0f3b224b98c3f3eb34fcf6feb894d98e

  # Windows images only, each for the Windows version of the runner, which a host of another version runs with Hyper-V isolation.
  dotnet-framework-image:
    name: "Image ${{ matrix.image-name }}"
    needs: dotnet-framework-changes
    if: needs.dotnet-framework-changes.outputs.changed == 'true'
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - image-name: winsamplenet48mvcwebapp
            image-definition: SampleMvcWebApp/Dockerfile
          - image-name: winsamplenet48svc
            image-definition: SampleWindowsService/Dockerfile
    uses: devpro/github-workflow-parts/.github/workflows/reusable-container-publication.yml@93d3944b0f3b224b98c3f3eb34fcf6feb894d98e
    with:
      container-registry: docker.io
      create-latest: ${{ github.ref_name == 'main' }}
      image-definition: ${{ matrix.image-definition }}
      image-name: ${{ matrix.image-name }}
      image-path: docker.io/devprofr
      image-tag: "1.0.${{ github.run_id }}"
      image-platform: ""
      windows-runner: windows-2025
      working-directory: samples/dotnet-4.8
      workflow-parts-version: 93d3944b0f3b224b98c3f3eb34fcf6feb894d98e
    secrets:
      container-registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
      container-registry-password: ${{ secrets.DOCKERHUB_TOKEN }}

  dotnet-changes:
    name: Changes .NET
    uses: devpro/github-workflow-parts/.github/workflows/reusable-git-check.yml@93d3944b0f3b224b98c3f3eb34fcf6feb894d98e
    with:
      paths: samples/dotnet-10.0 .github/workflows/pkg.yml
      workflow-parts-version: 93d3944b0f3b224b98c3f3eb34fcf6feb894d98e

  dotnet-image:
    name: Image winsamplenet10razorwebapp
    needs: dotnet-changes
    if: needs.dotnet-changes.outputs.changed == 'true'
    permissions:
      contents: read
      id-token: write
    uses: devpro/github-workflow-parts/.github/workflows/reusable-container-publication.yml@93d3944b0f3b224b98c3f3eb34fcf6feb894d98e
    with:
      container-registry: docker.io
      create-latest: ${{ github.ref_name == 'main' }}
      image-definition: src/SampleRazorWebApp/Dockerfile
      image-name: winsamplenet10razorwebapp
      image-path: docker.io/devprofr
      image-tag: "1.0.${{ github.run_id }}"
      image-platform: ""
      windows-runner: windows-2025
      working-directory: samples/dotnet-10.0
      workflow-parts-version: 93d3944b0f3b224b98c3f3eb34fcf6feb894d98e
    secrets:
      container-registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
      container-registry-password: ${{ secrets.DOCKERHUB_TOKEN }}
