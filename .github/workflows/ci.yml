# title: Continuous Integration pipeline
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: "${{ github.ref }}-${{ github.workflow }}"
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      apps: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Identify changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            winsamplenet48mvcwebapp: samples/dotnet-4.8/SampleMvcWebApp/*
            winsamplenet48svc: samples/dotnet-4.8/SampleWindowsService/*

  build:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore samples\dotnet-4.8\Devpro.SampleWindowsApps.sln

      - name: Build
        run: msbuild samples\dotnet-4.8\Devpro.SampleWindowsApps.sln /p:Configuration=Release /p:DeployOnBuild=true /p:PublishProfile=FolderProfile

  image-build:
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    strategy:
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-docker-action@v4

      - name: Build container image
        if: matrix.app == 'winsamplenet48mvcwebapp'
        run: docker build . -t devprofr/winsamplenet48mvcwebapp -f SampleMvcWebApp\Dockerfile
        working-directory: samples\dotnet-4.8

      - name: Build container image
        if: matrix.app == 'winsamplenet48svc'
        run: docker build . -t devprofr/winsamplenet48svc -f SampleWindowsService\Dockerfile
        working-directory: samples\dotnet-4.8
