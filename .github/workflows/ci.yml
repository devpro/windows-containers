# title: Continuous Integration pipeline
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: "${{ github.ref }}-${{ github.workflow }}"
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      apps: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Identify changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            winsamplenet48mvcwebapp: samples/dotnet-4.8/SampleMvcWebApp/*
            winsamplenet48svc: samples/dotnet-4.8/SampleWindowsService/*

  build:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore samples\dotnet-4.8\Devpro.SampleWindowsApps.sln

      - name: Build
        run: msbuild samples\dotnet-4.8\Devpro.SampleWindowsApps.sln /p:Configuration=Release

  image-build:
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-docker-action@v4

      - &docker-build
        name: Build ${{ env.IMAGE_NAME }} container image
        if: contains(needs.changes.outputs.apps, '${{ env.IMAGE_NAME }}')
        run: docker build . -t devprofr/${{ env.IMAGE_NAME }} -f ${{ env.PROJECT_PATH }}/Dockerfile
        working-directory: samples/dotnet-4.8

      - name: Build winsamplenet48mvcwebapp container image
        env:
          IMAGE_NAME: winsamplenet48mvcwebapp
          PROJECT_PATH: SampleMvcWebApp
        <<: *docker-build

      - name: Build winsamplenet48svc container image
        env:
          IMAGE_NAME: winsamplenet48svc
          PROJECT_PATH: SampleWindowsService
        <<: *docker-build
