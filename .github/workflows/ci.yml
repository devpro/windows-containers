name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.ref }}-ci
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markup-lint:
    name: Markup
    uses: devpro/github-workflow-parts/.github/workflows/reusable-markup-lint.yml@0f2bcb930aee19ab6b91d67abc4ac36b970ed16b

  # A Windows build takes minutes on a runner billed twice a Linux one, so only a change of the samples starts it.
  dotnet-framework-changes:
    name: Changes .NET Framework
    uses: devpro/github-workflow-parts/.github/workflows/reusable-git-check.yml@0f2bcb930aee19ab6b91d67abc4ac36b970ed16b
    with:
      paths: samples/dotnet-4.8 .github/workflows/ci.yml
      workflow-parts-version: 0f2bcb930aee19ab6b91d67abc4ac36b970ed16b

  dotnet-framework-quality:
    name: .NET Framework
    needs: dotnet-framework-changes
    if: needs.dotnet-framework-changes.outputs.changed == 'true'
    uses: devpro/github-workflow-parts/.github/workflows/reusable-dotnet-framework-quality.yml@0f2bcb930aee19ab6b91d67abc4ac36b970ed16b
    with:
      solution: Devpro.SampleWindowsApps.sln
      working-directory: samples/dotnet-4.8
      workflow-parts-version: 0f2bcb930aee19ab6b91d67abc4ac36b970ed16b

  # The images are built as the publication builds them, and never pushed from a pipeline other than the publication on main.
  dotnet-framework-image:
    name: "Image ${{ matrix.image-name }}"
    needs: dotnet-framework-changes
    if: needs.dotnet-framework-changes.outputs.changed == 'true'
    strategy:
      matrix:
        include:
          - image-name: winsamplenet48mvcwebapp
            image-definition: SampleMvcWebApp/Dockerfile
          - image-name: winsamplenet48svc
            image-definition: SampleWindowsService/Dockerfile
    uses: devpro/github-workflow-parts/.github/workflows/reusable-container-publication.yml@0f2bcb930aee19ab6b91d67abc4ac36b970ed16b
    with:
      push: false
      image-definition: ${{ matrix.image-definition }}
      image-name: ${{ matrix.image-name }}
      image-path: docker.io/devprofr
      image-tag: "1.0.${{ github.run_id }}"
      image-platform: ""
      windows-runner: windows-2025
      working-directory: samples/dotnet-4.8
      workflow-parts-version: 0f2bcb930aee19ab6b91d67abc4ac36b970ed16b
