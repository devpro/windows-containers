runner:
  # The markup lint runs on Node.js, the .NET code on the .NET SDK, and the .NET Framework code and the images on Windows.
  image: ghcr.io/devpro/ubuntu-node:latest
  images:
    "dotnet-quality*": ghcr.io/devpro/ubuntu-dotnet:latest

workflow:
  onDisallowedAction: fail
  allowedActions:
    - actions/*
    - github/*
    - devpro/github-workflow-parts/*
  exclude:
    - pkg.yml
